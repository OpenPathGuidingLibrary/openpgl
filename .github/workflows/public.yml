name: continuous (public)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  rocky-8:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
    steps:
      - name: Install packages (rocky 8)
        run: |
          yum -y install gcc-c++ clang tar git-lfs make python3
          yum -y install cmake
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Run
        run: |
          scripts/build_small.sh

  rocky-9:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - name: Install packages (rocky 9)
        run: |
          yum -y install gcc-c++ clang tar git-lfs make python3
          yum -y install cmake
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Run
        run: |
          scripts/build_small.sh

  ubuntu-24_04:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install packages (ubuntu 24.04)
        run: |
          apt-get update
          apt-get -y install g++ clang git-lfs libtbb-dev python3
          apt-get -y install cmake
          cmake --version
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Run
        run: |
          scripts/build_small.sh

  ubuntu-26_04:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install packages (ubuntu 26.04)
        run: |
          apt-get update
          apt-get -y install g++ clang git-lfs python3
          apt-get -y install cmake
          cmake --version
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Run
        run: |
          scripts/build_small.sh

  ubuntu-26_04-arm:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Install packages (ubuntu 26.04 arm)
        run: |
          #apt-get update
          #apt-get -y install g++ clang git-lfs python3
          #apt-get -y install cmake
          cmake --version
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Run
        run: |
          scripts/build_arm_small.sh

  windows:
    runs-on: windows-latest
    steps:
      - name: Install packages (Windows)
        shell: pwsh
        run: |
          # CMake, Git, Python and MSVC are preinstalled on the image.
          # Clang/LLVM is usually there too; install it if you need a specific version:
          # vcpkg install tbb:x64-windows
          cmake --version

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Run
        shell: bash
        run: |
          scripts/build_small.sh

  windows-arm:
    runs-on: windows-11-arm
    steps:
      - name: Install packages (Windows arm)
        shell: pwsh
        run: |
          # CMake, Git, Python and MSVC are preinstalled on the image.
          # Clang/LLVM is usually there too; install it if you need a specific version:
          # vcpkg install tbb:x64-windows
          cmake --version

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Run
        shell: bash
        run: |
          export CXX=clang-cl.exe
          export CC=clang-cl.exe
          scripts/build_arm_small.sh

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install packages (macOS)
        run: |
          # Apple Clang, Git, Python 3 and CMake come preinstalled.
          # brew install tbb git-lfs
          cmake --version

      - name: Build and Run
        run: |
          scripts/build_small.sh

  macos-15:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install packages (macOS)
        run: |
          # Apple Clang, Git, Python 3 and CMake come preinstalled.
          # brew install tbb git-lfs
          cmake --version

      - name: Build and Run
        run: |
          scripts/build_small.sh
